server {
    listen 80;
    listen [::]:80;

    server_name _;

    location / {
        proxy_pass         http://app;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;

        client_max_body_size 0;
    }
}
