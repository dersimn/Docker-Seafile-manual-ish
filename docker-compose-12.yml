services:
  web:
    image: nginx
    ports:
      - 80:80
    volumes:
      - nginx-logs:/logs
      - ./nginx-12.conf:/etc/nginx/conf.d/default.conf

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--connect",
          "--mariadbupgrade",
          "--innodb_initialized",
        ]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  app:
    image: seafileltd/seafile-mc:12.0.7
    # ports:
    #   - "80:80"
    volumes:
      - seafile-data:/shared
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_ROOT_PASSWD=root
      - DB_USER=seafile
      - DB_PASSWORD=seafile
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db
      - TIME_ZONE=Europe/Berlin
      - INIT_SEAFILE_ADMIN_EMAIL=a@a.a
      - INIT_SEAFILE_ADMIN_PASSWORD=aaa
      - SEAFILE_SERVER_HOSTNAME=seafile.here
      - SEAFILE_SERVER_PROTOCOL=http
      - SITE_ROOT=/
      - NON_ROOT=false
      - JWT_PRIVATE_KEY=qwertzuiopasdfghjklyxcvbnm1234567890
      - SEAFILE_LOG_TO_STDOUT=false
      - ENABLE_SEADOC=false
    depends_on:
      db:
        condition: service_healthy

volumes:
  # For PRODuctive environments:
  # - mount an external folder, or
  # - invent some kind of backup strategy for these volumes
  seafile-data:
  db-data:
  nginx-logs:
